name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  # The Git 2.36 floor (feature 004: FR-067, research.md R11). The two test
  # jobs above (ubuntu-latest, Python 3.10 and 3.12) run on whichever Git
  # their runner ships. This one builds Git 2.36.6 from kernel.org's tarball,
  # caches the install by version and runner OS, and runs the clean, status
  # and doctor tests with that Git first on PATH.
  # It is the only job that runs "The sixteenth scrubbed name on Git 2.36".
  git-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_FLOOR_VERSION: '2.36.6'
      # kernel.org's sha256sums.asc value for git-2.36.6.tar.xz.
      GIT_FLOOR_SHA256: 3a54356dd0a6b23d7d0742952d5c86958ad8f797cbe41bd1952bc83ec429ea94
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - name: Choose the install prefix
        run: echo "GIT_FLOOR_PREFIX=$HOME/git-floor/$GIT_FLOOR_VERSION" >> "$GITHUB_ENV"
      - name: Restore the Git build
        id: git-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GIT_FLOOR_PREFIX }}
          key: git-${{ env.GIT_FLOOR_VERSION }}-${{ runner.os }}
      - name: Build Git ${{ env.GIT_FLOOR_VERSION }}
        if: steps.git-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "git-$GIT_FLOOR_VERSION.tar.xz" \
            "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_FLOOR_VERSION.tar.xz"
          echo "$GIT_FLOOR_SHA256  git-$GIT_FLOOR_VERSION.tar.xz" | sha256sum -c -
          mkdir git-src
          tar -xJf "git-$GIT_FLOOR_VERSION.tar.xz" -C git-src --strip-components=1
          make -C git-src -j"$(nproc)" \
            NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 NO_CURL=1 NO_OPENSSL=1 \
            prefix="$GIT_FLOOR_PREFIX" install
      - name: Put the built Git first on PATH
        run: echo "$GIT_FLOOR_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Check the Git version
        run: |
          git --version
          test "$(git --version)" = "git version $GIT_FLOOR_VERSION"
      - run: python -m unittest discover -s tests -v -k test_clean_ -k test_status_ -k test_doctor_
